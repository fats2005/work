```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .profile-picture {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-picture img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1e3a8a;
            display: none;
            margin: 10px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37,99,235,0.3);
        }

        input[type="file"] {
            padding: 10px;
            background: #f8fafc;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
            font-weight: bold;
        }

        .required {
            color: red;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 18px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Job Application Portal</h1>
        <p>Complete the form below to apply for a job.</p>
    </div>

    <form id="jobApplicationForm">

        <!-- Profile Picture -->
        <div class="profile-picture">
            <label>Profile Picture</label>

            <img id="previewImage" alt="Profile Preview">

            <input
                type="file"
                id="profilePicture"
                accept="image/*"
                required
            >
        </div>

        <!-- Full Name -->
        <div class="form-group">
            <label for="fullName">
                Full Name <span class="required">*</span>
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="row">

            <!-- ID Number -->
            <div class="form-group">
                <label for="idNumber">
                    ID Number <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="idNumber"
                    placeholder="Enter ID number"
                    required
                >
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">
                    Gender <span class="required">*</span>
                </label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                    <option value="Prefer not to say">
                        Prefer not to say
                    </option>
                </select>
            </div>

        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phone">
                Phone Number <span class="required">*</span>
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="+254 700 000 000"
                required
            >
        </div>

        <!-- Country -->
        <div class="form-group">
            <label for="country">
                Country <span class="required">*</span>
            </label>

            <select id="country" required>
                <option value="">Select Country</option>
                <option value="Kenya">Kenya</option>
                <option value="Uganda">Uganda</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Rwanda">Rwanda</option>
                <option value="Nigeria">Nigeria</option>
                <option value="South Africa">South Africa</option>
                <option value="Ghana">Ghana</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="United States">United States</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- CV -->
        <div class="form-group">
            <label for="cv">
                Upload CV <span class="required">*</span>
            </label>

            <input
                type="file"
                id="cv"
                accept=".pdf,.doc,.docx"
                required
            >

            <small>
                Accepted formats: PDF, DOC, DOCX
            </small>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn">
            Submit Job Application
        </button>

        <div class="success" id="successMessage">
            ✓ Application submitted successfully!
            <br>
            Thank you for applying.
        </div>

    </form>

    <div class="footer">
        © 2026 Job Application Portal
    </div>

</div>


<script>

    // Profile picture preview
    document.getElementById("profilePicture")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (file) {

                const image = document.getElementById("previewImage");

                image.src = URL.createObjectURL(file);

                image.style.display = "block";
            }
        });


    // Form submission
    document.getElementById("jobApplicationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value;

            const idNumber =
                document.getElementById("idNumber").value;

            const phone =
                document.getElementById("phone").value;

            const gender =
                document.getElementById("gender").value;

            const country =
                document.getElementById("country").value;

            const cv =
                document.getElementById("cv").files[0];

            const picture =
                document.getElementById("profilePicture").files[0];


            if (!fullName ||
                !idNumber ||
                !phone ||
                !gender ||
                !country ||
                !cv ||
                !picture) {

                alert("Please complete all required fields.");

                return;
            }


            // Display confirmation
            document.getElementById("successMessage")
                .style.display = "block";


            console.log("JOB APPLICATION");

            console.log("Full Name:", fullName);
            console.log("ID Number:", idNumber);
            console.log("Gender:", gender);
            console.log("Phone:", phone);
            console.log("Country:", country);
            console.log("CV:", cv.name);
            console.log("Picture:", picture.name);


            // Reset form
            document.getElementById("jobApplicationForm")
                .reset();

            document.getElementById("previewImage")
                .style.display = "none";

        });

</script>

</body>
</html>
```
